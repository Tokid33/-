version: '3.9'
services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./workspace:/app/workspace
    depends_on:
      - db
      - minio
    command: ["python", "-m", "app.main", "--watch"]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.76.0
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_FUNCTION_ALLOW_EXTERNAL: "openai,pg,busboy"
    volumes:
      - ./workflows:/home/node/.n8n
    depends_on:
      - app
      - db
      - minio
volumes:
  pgdata:
  miniodata:
